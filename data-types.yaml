- name: print data types
  hosts: local
  connection: local
  vars:
    course: "Aiops with DevSecOps" # string
    duration_in_hrs: 150  # number or intiger
    is_live_sessions: true # boolean
    topics: # list
    - Linux
    - Shell
    - Ansible
    - Terraform
    more_details: # dictionary/map
      trainer: sivakumar
      months: 4
    exact_duration_in_months: 4.5 # float
  tasks:
  - name: print the data types
    debug:
      msg: |
        name: "{{ course }} : {{ course | type_debug }}"
        duration: "{{ duration_in_hrs }} : {{ duration_in_hrs | type_debug }}"
        Live sessions: "{{ is_live_sessions }} : {{ is_live_sessions | type_debug }}"
        topics are: "{{ topics }} : {{ topics | type_debug }}"
        more details: "{{ more_details }} : {{ more_details | type_debug }}"
        duration: "{{ exact_duration_in_months }} : {{ exact_duration_in_months | type_debug }}"
